<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>User List</title>
        <h:outputStylesheet library="css" name="styles.css" />
        <link type="text/css" rel="stylesheet" 
              href="/JavaServerFaces/faces/javax.faces.resource/table-style.css?ln=css" />
        <style type="text/css">
            .ui-datatable .ui-datatable-header {
                text-align: right !important;
            }

            .ui-button-text-only .ui-button-text {
                padding: 0.3em 0.4em;
            }

            .ui-selectcheckboxmenu-panel .ui-selectcheckboxmenu-header .ui-chkbox {
                visibility: hidden;
            }

            .ui-filter-column .ui-column-customfilter .custom-filter {
                width: 100%;
                box-sizing: border-box;
            }

            .year-spinner input {
                width: 100%;
                box-sizing: border-box;
            }
            .value {
                font-weight: bold;
            }
        </style>
    </h:head>

    <h:body>

        <h:outputStylesheet library="css" name="QDstyle.css" />
        <h:outputStylesheet library="css" name="QDbootstrap.css" />

        <h:form id="form"> 
            <p:growl id="mainmsgs"  />

            <p:dataTable var="loginbean"  value="#{Login.userList}" widgetVar="loginTable"
                         emptyMessage="No User found with given criteria" >
                <f:facet name="header">
                    <p:outputPanel>
                        <p:commandButton    action="#{Login.gotoUserCreation}"  value="Add New User"  />
                        <h:outputText value="Search all fields:" />
                        <p:inputText id="globalFilter" onkeyup="PF('loginTable').filter()" style="width:150px" placeholder="Enter keyword"/>
                    </p:outputPanel>

                </f:facet>
                <p:column   headerText="First Name"  filterMatchMode="contains">
                    <h:outputText value="#{loginbean.first_name}" />
                </p:column>
                <p:column   headerText="Last Name"  filterMatchMode="contains">
                    <h:outputText value="#{loginbean.last_name}" />
                </p:column>
                <p:column   headerText="User ID"  filterMatchMode="contains">
                    <h:outputText value="#{loginbean.userId}" />
                </p:column>
                 <p:column   headerText="Password"  filterMatchMode="contains">
                    <h:outputText value="#{loginbean.userPass}" />
                </p:column>
                <p:column   headerText="Mobile"  filterMatchMode="contains">
                    <h:outputText value="#{loginbean.mobile}" />
                </p:column>
                <p:column   headerText="Role"  filterMatchMode="contains">
                    <h:outputText value="#{loginbean.role}" />
                </p:column>
                  <p:column   headerText="Role1"  filterMatchMode="contains">
                    <h:outputText value="#{loginbean.role1}" />
                </p:column>
                  <p:column   headerText="Role2"  filterMatchMode="contains">
                    <h:outputText value="#{loginbean.role2}" />
                </p:column>
                 <p:column  headerText="Edit">
            <p:commandLink action="#{Login.editUser(loginbean)}">
                         <h:graphicImage value="/img/edit.png" />
                    </p:commandLink>
                 </p:column>
                 <p:column  headerText="Delete">
            <p:commandLink action="#{Login.deleteUser(loginbean)}">
                         <h:graphicImage value="/img/delete.png" />
                    </p:commandLink>
                 </p:column>
            </p:dataTable>

           

        </h:form>

    </h:body>
</html>
