# repos/ISSUES.md mirrors the GitHub issues (repos/common/deployment/release/issues_md.py): a new COMMON / KYC issue
# gets its row in the open backlog; a closed one moves to Fixed (with the date). Nobody edits the rows by hand.
name: Issues sync
on:
  issues:
    types: [opened, closed]
permissions: {}
concurrency: issues-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update ISSUES.md
        env:
          ACTION: ${{ github.event.action }}
          NUM: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          URL: ${{ github.event.issue.html_url }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          REASON: ${{ github.event.issue.state_reason }}
        run: |
          git pull -q origin main
          python3 repos/common/deployment/release/issues_md.py "$ACTION" || exit 0
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "ISSUES.md: #$NUM $ACTION" && git push -q || echo "nothing to commit"
