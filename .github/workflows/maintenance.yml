# Maintenance tools, run by hand only (I-084 - before: cleanup-runs.yml, training-videos.yml).
# Actions -> Maintenance -> Run workflow -> task:
#   cleanup-runs     deletes the history of workflow runs (issue #219). Start with "dry run" ticked (the default): it
#                    only lists what would be deleted. Runs still in progress and this run itself are never deleted.
#                    A deleted run (with its logs and artifacts) cannot be restored.
#   training-videos  uploads the training videos (mp4) kept in the repository to the GitHub Release
#                    "training-videos", so videos are no longer added to git; each docs/components/<x>/video.md links
#                    to its asset.
name: Maintenance
run-name: "Maintenance: ${{ inputs.task }}"
on:
  workflow_dispatch:
    inputs:
      task:
        description: Task
        type: choice
        options: [cleanup-runs, training-videos]
        default: cleanup-runs
      workflow:
        description: 'Workflow file name (e.g. pipeline.yml), or "all"'
        default: all
      older_than_days:
        description: Only runs created more than this many days ago (0 = any age)
        default: '0'
      status:
        description: Only runs with this result
        type: choice
        options: [all, failure, cancelled, success, skipped]
        default: all
      dry_run:
        description: Dry run - only list the runs, delete nothing
        type: boolean
        default: true
permissions: {}

jobs:
  cleanup:
    name: Delete workflow runs
    if: inputs.task == 'cleanup-runs'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: cleanup-runs
      cancel-in-progress: false
    permissions:
      actions: write   # list and delete workflow runs
    steps:
      - name: Delete the matching runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ inputs.workflow }}
          DAYS: ${{ inputs.older_than_days }}
          STATUS: ${{ inputs.status }}
          DRY_RUN: ${{ inputs.dry_run }}
          SELF: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "::error::older_than_days must be a whole number"; exit 1; }
          if [ "$WORKFLOW" = all ]; then path="repos/$REPO/actions/runs"; else path="repos/$REPO/actions/workflows/$WORKFLOW/runs"; fi
          args=(-f per_page=100)
          if [ "$STATUS" != all ]; then args+=(-f "status=$STATUS"); fi
          if [ "$DAYS" -gt 0 ]; then args+=(-f "created=<$(date -u -d "-$DAYS days" +%Y-%m-%d)"); fi
          gh api --paginate -X GET "$path" "${args[@]}" \
            -q '.workflow_runs[] | select(.status == "completed") | "\(.id)\t\(.name)\t\(.conclusion)\t\(.created_at)"' \
            | awk -F'\t' -v self="$SELF" '$1 != self' > runs.tsv
          total=$(wc -l < runs.tsv)
          {
            echo "### Workflow runs: workflow \`$WORKFLOW\`, status \`$STATUS\`, older than $DAYS day(s)"
            echo; echo "$total completed run(s) match."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run - nothing deleted. Matching runs:"; cut -f2- runs.tsv | head -200
            echo "Dry run: nothing deleted (run again without dry run to delete them)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          deleted=0; failed=0
          while IFS=$'\t' read -r id name conclusion created; do
            if gh api -X DELETE "repos/$REPO/actions/runs/$id" > /dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1)); echo "::warning::could not delete run $id ($name, $conclusion, $created)"
            fi
          done < runs.tsv
          echo "deleted $deleted run(s), $failed could not be deleted"
          echo "Deleted $deleted run(s); $failed could not be deleted." >> "$GITHUB_STEP_SUMMARY"

  training-videos:
    name: Upload the training videos
    if: inputs.task == 'training-videos'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view training-videos >/dev/null 2>&1 || gh release create training-videos --title "Training videos" \
            --notes "Training videos of COMMON and KYC (assets). Each component's docs/components/<x>/video.md links to its video."
          find . -name '*.mp4' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            app=$(echo "$f" | grep -q '/kyc/' && echo kyc || echo common)
            cp "$f" "$app-$(basename "$f")"
            gh release upload training-videos "$app-$(basename "$f")" --clobber
          done
