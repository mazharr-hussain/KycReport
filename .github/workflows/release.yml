# Publishes the GitHub Release of each application release merged by a person (release/publish.sh; the pipeline's own
# merge in job 7.2 publishes it itself, because a merge made with the workflow token starts no workflow):
#   - the merged pull request's title gives the release: "<APP> Release <N>: <summary>" -> tag <app>-<N> (issue #218)
#   - COMMON: the draft release prepared by the pipeline (pipeline.yml 7.1: the APEXlang zip exported from the tested
#     application, readable APEX docs, SchemaSpy docs) is published, with the PR's linked issues ("Fixes #n") as notes
#   - no draft (KYC today): the zip committed in repos/<app>/releases/<name>_<N>.zip, if any
name: Release
on:
  push:
    branches: [main]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the release of the merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AFTER: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          pr=$(printf '%s' "$MESSAGE" | sed -nE '1s/^Merge pull request #([0-9]+).*/\1/p')
          if [ -z "$pr" ]; then echo "not a pull request merge - nothing to publish"; exit 0; fi
          bash repos/common/deployment/release/publish.sh "$pr" "$AFTER"
