# Checks on every pull request (repos/ - apex/ is frozen history). Nothing is deployed.
#   - static: repos/tools/pr_checks.py - manifest units exist, pages in SOURCE-MAP.json, no ';' ending a comment line
#     inside a SQL statement, nothing changed under apex/ (errors); KYC writing XXFND_ tables, HTML in PL/SQL, release
#     PR without "Fixes #n" (warnings)
#   - build: each application builds (repos/<app>/build.sh), its APEXlang validates (SQLcl `apex validate`, no
#     database needed), and the generated technical docs match the committed ones (warning)
# Database install / upgrade and browser tests need an Oracle database with APEX 26.1 and run on the user's server.
name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install safety and golden rules
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s' "$BODY" > /tmp/body.txt
          if [ -n "$BASE" ]; then python3 repos/tools/pr_checks.py --base "$BASE" --body-file /tmp/body.txt
          else python3 repos/tools/pr_checks.py; fi

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [common, kyc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build
        # the other application first: the dependency map and technical docs list its pages too
        run: |
          other=$([ "${{ matrix.app }}" = common ] && echo kyc || echo common)
          sh repos/$other/build.sh > /dev/null
          sh repos/${{ matrix.app }}/build.sh
      - name: Technical docs are up to date
        run: |
          if ! git diff --quiet -- repos/${{ matrix.app }}/docs/components; then
            echo "::warning::The generated technical docs differ from the committed ones - run repos/${{ matrix.app }}/build.sh and commit repos/${{ matrix.app }}/docs/components"
            git diff --stat -- repos/${{ matrix.app }}/docs/components | tail -5
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SQLcl
        run: |
          curl -sSL -o sqlcl.zip https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-latest.zip
          unzip -q sqlcl.zip
      - name: Validate the APEXlang application
        run: |
          out=$(printf "apex validate -input %s\nexit\n" "$PWD/repos/${{ matrix.app }}/dist/app" | sqlcl/bin/sql -S /nolog 2>&1)
          echo "$out" | grep -iE "^sqlcl|version" | head -3
          printf '%s\n' "$out" > validate.log
          python3 - <<'PY'
          import re, sys
          out = open('validate.log').read()
          if 'Validation successful' in out:
              print('Validation successful'); sys.exit(0)
          blocks = [b.strip() for b in re.split(r'\n(?=File: )', out) if b.strip().startswith('File: ')]
          # the downloadable SQLcl validates with APEX 26.2 rules; executionMappingIdentifier only exists in 26.2 and the
          # applications target 26.1 (compatibilityMode 26.1), so those errors are reported as warnings only
          later = [b for b in blocks if 'executionMappingIdentifier' in b]
          real = [b for b in blocks if b not in later]
          for b in later:
              print('::warning::APEX 26.2 rule (app targets 26.1): ' + ' | '.join(b.splitlines()[:5]))
          for b in real:
              print('::error::' + ' | '.join(b.splitlines()[:6]))
          if real or not blocks:
              print(out[-3000:] if not blocks else ''); sys.exit(1)
          print(f'Validation successful for APEX 26.1 ({len(later)} APEX 26.2-only finding(s) reported as warnings)')
          PY
