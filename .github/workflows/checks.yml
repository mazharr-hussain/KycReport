# Checks on every pull request (repos/ - apex/ is frozen history). Nothing is deployed.
#   - static: repos/tools/pr_checks.py - manifest units exist, pages in SOURCE-MAP.json, no ';' ending a comment line
#     inside a SQL statement, nothing changed under apex/ (errors); KYC writing XXFND_ tables, HTML in PL/SQL, release
#     PR without "Fixes #n" (warnings)
#   - build: each application builds (repos/<app>/build.sh), its APEXlang validates (SQLcl `apex validate`, no
#     database needed), and the generated technical docs match the committed ones (warning)
# Database install / upgrade and browser tests need an Oracle database with APEX 26.1 and run on the user's server.
name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install safety and golden rules
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s' "$BODY" > /tmp/body.txt
          if [ -n "$BASE" ]; then python3 repos/tools/pr_checks.py --base "$BASE" --body-file /tmp/body.txt
          else python3 repos/tools/pr_checks.py; fi

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [common, kyc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build
        run: sh repos/${{ matrix.app }}/build.sh
      - name: Technical docs are up to date
        run: |
          if ! git diff --quiet -- repos/${{ matrix.app }}/docs/components; then
            echo "::warning::The generated technical docs differ from the committed ones - run repos/${{ matrix.app }}/build.sh and commit repos/${{ matrix.app }}/docs/components"
            git diff --stat -- repos/${{ matrix.app }}/docs/components | tail -5
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SQLcl
        run: |
          curl -sSL -o sqlcl.zip https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-latest.zip
          unzip -q sqlcl.zip
      - name: Validate the APEXlang application
        run: |
          out=$(printf "apex validate -input %s\nexit\n" "$PWD/repos/${{ matrix.app }}/dist/app" | sqlcl/bin/sql -S /nolog 2>&1)
          echo "$out" | tail -20
          echo "$out" | grep -q "Validation successful" || { echo "::error::APEXlang validation failed"; exit 1; }
