# Checks on every pull request (repos/ - apex/ is frozen history). Nothing is deployed.
#   - static: repos/tools/pr_checks.py - manifest units exist, pages in SOURCE-MAP.json, no ';' ending a comment line
#     inside a SQL statement, nothing changed under apex/ (errors); KYC writing XXFND_ tables, HTML in PL/SQL, release
#     PR without "Fixes #n", APEX page security, PL/SQL risks, install safety, release folder complete (warnings)
#   - pmd: PMD PL/SQL rules (repos/tools/pmd-plsql.xml) on the changed packages (annotations)
#   - build: each application builds (repos/<app>/build.sh), its APEXlang validates (SQLcl `apex validate`, no
#     database needed), and the generated technical docs match the committed ones (warning)
# Database install / upgrade and browser tests need an Oracle database with APEX 26.1 and run on the user's server.
name: Checks

on:
  pull_request:
    paths: ['repos/kyc/**']   # COMMON runs in pipeline.yml (one record per COMMON PR)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install safety and golden rules
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s' "$BODY" > /tmp/body.txt
          if [ -n "$BASE" ]; then python3 repos/tools/pr_checks.py --base "$BASE" --body-file /tmp/body.txt
          else python3 repos/tools/pr_checks.py; fi

  pmd:
    # PL/SQL analysis of the changed packages (repos/tools/pmd-plsql.xml); violations are annotations, not failures
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # the action lists the changed files of the PR
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: pmd/pmd-github-action@v2
        continue-on-error: true   # warning mode first
        with:
          rulesets: repos/tools/pmd-plsql.xml
          sourcePath: repos
          analyzeModifiedFilesOnly: ${{ github.event_name == 'pull_request' }}

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [kyc]   # COMMON runs in common-pipeline.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build
        # the other application first: the dependency map and technical docs list its pages too
        run: |
          other=$([ "${{ matrix.app }}" = common ] && echo kyc || echo common)
          sh repos/$other/build.sh > /dev/null
          sh repos/${{ matrix.app }}/build.sh
      - name: Technical docs are up to date
        run: |
          if ! git diff --quiet -- repos/${{ matrix.app }}/docs/components; then
            echo "::warning::The generated technical docs differ from the committed ones - run repos/${{ matrix.app }}/build.sh and commit repos/${{ matrix.app }}/docs/components"
            git diff --stat -- repos/${{ matrix.app }}/docs/components | tail -5
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SQLcl 26.1.2 (matches APEX 26.1; sqlcl-latest validates with newer APEX rules)
        run: |
          sudo apt-get install -y -qq rpm2cpio cpio > /dev/null
          curl -sSL -o sqlcl.rpm https://yum.oracle.com/repo/OracleLinux/OL8/oracle/software/x86_64/getPackage/sqlcl-26.1.2-2.el8.noarch.rpm
          rpm2cpio sqlcl.rpm | cpio -idm --quiet
          chmod +x opt/oracle/sqlcl/bin/sql
      - name: Validate the APEXlang application
        run: |
          out=$(printf "apex validate -input %s\nexit\n" "$PWD/repos/${{ matrix.app }}/dist/app" | opt/oracle/sqlcl/bin/sql -S /nolog 2>&1)
          echo "$out"
          echo "$out" | grep -q "Validation successful" || { echo "::error::APEXlang validation failed"; exit 1; }
