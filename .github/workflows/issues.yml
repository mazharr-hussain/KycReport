# Private issue automation
# Public issue creation, project-board writes, and weekly backlog publication
# are intentionally disabled so repository data stays outside public endpoints.

name: Issues

on:
  workflow_dispatch:

permissions: {}

jobs:
  private-only:
    name: Private issue automation disabled
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Confirm public issue operations remain disabled
        run: echo "Issue creation, issue updates, and project-board publication are disabled." >> "$GITHUB_STEP_SUMMARY"
