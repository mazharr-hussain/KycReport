# Puts each new or labelled issue on its GitHub Project board: label COMMON -> the COMMON project,
# label KYC -> the KYC project: "Common Application" = project 4, "KYC Application" = project 3;
# the token (classic, scopes project + repo) from the secret ADD_TO_PROJECT_PAT.
name: Add issues to projects
on:
  issues:
    types: [opened, reopened, labeled, transferred]
permissions:
  issues: read
jobs:
  common:
    if: contains(github.event.issue.labels.*.name, 'COMMON')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/mazharr-hussain/projects/4
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          labeled: COMMON
  kyc:
    if: contains(github.event.issue.labels.*.name, 'KYC')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/mazharr-hussain/projects/3
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          labeled: KYC
