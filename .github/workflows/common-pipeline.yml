# COMMON pipeline - one job, steps in order (repos/common/deployment):
#   stage 1 (offline): checks/run.sh (static, build, APEXlang validation) + PMD (warnings)
#   stage 2 (database, only when stage 1 passed): db/run.sh (uninstall, deploy this, uninstall, deploy last, upgrade,
#            re-run, invalid objects, test users, tests) on the validation ADB (environment "Oracle DB Dev")
# On failure: a comment on the open PR (the PR stays open), or an issue when there is no PR. When the whole chain is
# green: the PR is merged into main and its release zip is published as GitHub Release COMMON <N>. No e-mail.
name: COMMON pipeline

on:
  workflow_call:   # child of the Pipeline wrapper (pipeline.yml)
  workflow_dispatch:

permissions:
  contents: write   # merge the PR and publish the release when the chain is green
  issues: write
  pull-requests: write

concurrency:
  group: validation-db
  cancel-in-progress: false

jobs:
  pipeline:
    name: offline checks, then database
    runs-on: ubuntu-latest
    environment: Oracle DB Dev
    timeout-minutes: 90
    env:
      SQL: ${{ github.workspace }}/opt/oracle/sqlcl/bin/sql
      WALLET: /tmp/common-run/wallet.zip
      LOG_DIR: /tmp/common-run/logs
      VAL_DB_SERVICE: ${{ secrets.VAL_DB_SERVICE }}
      ADMIN_PW: ${{ secrets.VAL_DB_ADMIN_PASSWORD }}
      XXCUS_PW: ${{ secrets.VAL_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SQLcl 26.1.2 (cached)
        id: sqlcl
        uses: actions/cache@v4
        with:
          path: opt/oracle/sqlcl
          key: sqlcl-26.1.2-2
      - name: Install SQLcl
        if: steps.sqlcl.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq rpm2cpio cpio > /dev/null
          curl -sSL -o sqlcl.rpm https://yum.oracle.com/repo/OracleLinux/OL8/oracle/software/x86_64/getPackage/sqlcl-26.1.2-2.el8.noarch.rpm
          rpm2cpio sqlcl.rpm | cpio -idm --quiet && rm sqlcl.rpm

      - name: Stage 1 - offline validation
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/body.txt"; [ -n "$BASE" ] && export BODY="$RUNNER_TEMP/body.txt"
          bash repos/common/deployment/checks/run.sh
      - name: Stage 1 - PMD (PL/SQL rules, warnings only)
        uses: pmd/pmd-github-action@v2
        continue-on-error: true
        with:
          rulesets: repos/common/deployment/checks/pmd-plsql.xml
          sourcePath: repos/common
          analyzeModifiedFilesOnly: ${{ github.event_name == 'pull_request' }}

      - name: Stage 2 - database
        env:
          WALLET_B64: ${{ secrets.VAL_DB_WALLET }}
        run: |
          mkdir -p /tmp/common-run && printf '%s' "$WALLET_B64" | base64 -d > "$WALLET"
          bash repos/common/deployment/db/run.sh "${{ github.event.pull_request.base.sha || 'origin/main' }}"

      - name: Report the failure (comment on the open PR, or an issue when there is no PR)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), dir = process.env.LOG_DIR;
            const read = f => { try { return fs.readFileSync(`${dir}/${f}`, 'utf8') } catch { return '' } };
            const stepName = read('failed').trim() || 'setup';
            const tail = read(`${stepName}.log`).split('\n').slice(-100).join('\n');
            const errors = tail.split('\n').filter(l => /ORA-|PLS-|SP2-|ERROR|Error|::error::|FAIL/.test(l)).slice(0, 15).join('\n');
            const pr = context.payload.pull_request;
            const branch = pr?.head.ref || context.ref.replace('refs/heads/', '');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const details = `| | |\n|---|---|\n| Step | \`${stepName}\` |\n| Branch | \`${branch}\` |\n| Commit | ${context.sha.slice(0, 7)} |\n| Run | ${runUrl} |\n\n**Errors**\n\`\`\`\n${errors || '(see the log)'}\n\`\`\`\n\n<details><summary>Last 100 lines of the step log</summary>\n\n\`\`\`\n${tail}\n\`\`\`\n</details>`;
            if (pr) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number,
                body: `**COMMON pipeline failed at \`${stepName}\`** - the PR stays open; push a fix and the chain runs again.\n\n${details}` });
              return;
            }
            const title = `COMMON pipeline failed: ${stepName} (${branch})`;
            const body = `Type: Bug\nPriority: P1\n\n${details}`;
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', labels: 'COMMON', per_page: 100 });
            const same = open.find(i => i.title === title);
            if (same) await github.rest.issues.createComment({ ...context.repo, issue_number: same.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['COMMON'] });

      - name: Chain green - merge the PR into main
        id: merge
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const fs = require('fs');
            let tests = ''; try { tests = fs.readFileSync(`${process.env.LOG_DIR}/tests-summary`, 'utf8').trim() } catch {}
            if (pr.draft) await github.graphql('mutation($id: ID!) { markPullRequestReadyForReview(input: {pullRequestId: $id}) { clientMutationId } }', { id: pr.node_id });
            const m = await github.rest.pulls.merge({ ...context.repo, pull_number: pr.number, sha: pr.head.sha, merge_method: 'merge' });
            await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number,
              body: `COMMON pipeline passed on ${pr.head.sha.slice(0, 7)} - merged into main (${m.data.sha.slice(0, 7)}).\nOffline checks, APEXlang validation, deploy this version, deploy the last version, upgrade, re-run, no invalid objects, app 135 imported.\nDB tests: ${tests || '-'}` });
            core.setOutput('sha', m.data.sha);

      - name: Release - downloadable APEX zip (GitHub Release COMMON <N>)
        if: success() && steps.merge.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          MERGED: ${{ steps.merge.outputs.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # the release zips this PR adds (repos/common/releases/<name>_<N>.zip); a PR without a release zip publishes nothing
          zips=$(git diff --name-only --diff-filter=A "$BASE" "$HEAD" -- 'repos/common/releases/*.zip')
          [ -n "$zips" ] || { echo "No release zip in this PR - nothing to publish"; exit 0; }
          fixes=$(printf '%s' "$PR_BODY" | grep -oiE '(fixes|closes|resolves) #[0-9]+' | grep -oE '#[0-9]+' | sort -u | tr '\n' ' ')
          for zip in $zips; do
            n=$(echo "$zip" | sed -E 's/.*_([0-9]+)\.zip$/\1/'); tag="common-$n"
            gh release view "$tag" > /dev/null 2>&1 && { echo "$tag exists"; continue; }
            readme=$(ls -d repos/common/releases/$n-*/README.md 2>/dev/null | head -1)
            { [ -n "$readme" ] && cat "$readme"; echo; [ -n "$fixes" ] && echo "Closed issues: $fixes"; } > notes.md
            gh release create "$tag" "$zip" --title "COMMON $n" --notes-file notes.md --target "$MERGED"
            echo "published release COMMON $n"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: common-pipeline-logs
          path: /tmp/common-run/logs
          if-no-files-found: ignore
