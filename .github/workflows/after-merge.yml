# Private post-merge workflow
# This workflow intentionally performs no public publishing, release, Pages,
# project-board, issue, or pull-request-comment operations.

name: After merge
run-name: "Private merge check: ${{ github.event.head_commit.message || format('PR {0}', inputs.pr) }}"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Merged pull request number
        required: true

permissions:
  contents: read

concurrency:
  group: private-after-merge
  cancel-in-progress: false

jobs:
  validate:
    name: Private merge validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Record private merge result
        run: |
          set -euo pipefail
          echo "Merge validated for ${{ github.sha }}; no public output was published." >> "$GITHUB_STEP_SUMMARY"
