# After a merge to main (I-091): private - it publishes nothing (no GitHub Release, Pages site, project README, issue or
# PR comment) and only records the merge in the run summary. The pipeline's draft release (step 9.1a) stays a draft.

name: After merge
run-name: "Private merge check: ${{ github.event.head_commit.message || format('PR {0}', inputs.pr) }}"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Merged pull request number
        required: true

permissions:
  contents: read

concurrency:
  group: private-after-merge
  cancel-in-progress: false

jobs:
  validate:
    name: Private merge validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Record private merge result
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Merge validated for $SHA; no public output was published." >> "$GITHUB_STEP_SUMMARY"
