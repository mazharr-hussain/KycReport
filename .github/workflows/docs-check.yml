# Warns (does not fail) when a PR changes a component's code under repos/<app>/features/<x>/ but not its requirements
# (repos/<app>/docs/components/<x>/requirements.md). A PR body with "no-req-change" skips the warning.
name: Docs check
on:
  pull_request:
    paths: ['repos/kyc/features/**']   # COMMON: step in repos/common/deployment/checks/run.sh
permissions:
  contents: read
  pull-requests: read
jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Components changed without their requirements
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qi 'no-req-change'; then echo "Skipped (no-req-change)"; exit 0; fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          for c in $(printf '%s\n' "$changed" | sed -n 's#^repos/\([a-z]*\)/features/\([^/]*\)/.*#\1/\2#p' | sort -u); do
            app=${c%%/*}; f=${c#*/}
            printf '%s\n' "$changed" | grep -q "^repos/$app/docs/components/$f/requirements.md$" \
              || echo "::warning::$app/$f changed but repos/$app/docs/components/$f/requirements.md did not (add no-req-change to the PR body if none is needed)"
          done
