# COMMON pipeline wrapper - one record per run in the Actions list, named after the PR title
# (convention "<APP> <release>: <description>") and the run number. Inside: one Child job, also named after the PR
# title, that runs everything in sequence (offline checks, then database) - common-pipeline.yml. Steps in sequence
# share one job; separate jobs only for work that runs in parallel. KYC is not wired in yet.
name: COMMON
run-name: "${{ github.event.pull_request.title || 'COMMON: manual run' }}:${{ github.run_number }}"

on:
  pull_request:
    paths: ['repos/common/**', '.github/workflows/pipeline.yml', '.github/workflows/common-pipeline.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pipeline:
    name: "${{ github.event.pull_request.title || 'COMMON: manual run' }} - Child pipeline:${{ github.run_number }}"
    uses: ./.github/workflows/common-pipeline.yml
    secrets: inherit
