<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <body>
        <ui:composition>
   
            <div class="row">
                <div class="col-xs-5 col-md-6">
                    <a href='/KycReport/master.xhtml'><h:graphicImage value="/img/qlogo.png" /></a>
                </div>
                <div class="col-xs-7 col-md-6" >
                    <a id="MyAnchor" class="exit pull-right margin-top-10" href="/KycReport">Exit</a>
                    <div class="clearfix"></div>
                    <div class="proifle pull-right">
                        Welcome
                        <h:outputLabel value="#{MenuView.name}" />
                      
                      
                    </div>
                   
                </div>
            </div>
          
            <h:form>
                 <div style="font-size:12px;">
                   
                    <p:tabMenu activeIndex="#{param.i}">
                        <p:menuitem value="KYC Search" action="#{MenuView.kycSearch}" icon="pi pi-star">
                            <f:param name="i" value="0" />
                        </p:menuitem>
                        <p:menuitem value="New KYC" action="#{MenuView.createnew}" icon="pi pi-search">
                            <f:param name="i" value="1" />
                        </p:menuitem>
                         <p:menuitem value="New Entity" action="#{MenuView.createNewEntity}" icon="pi pi-search">
                            <f:param name="i" value="2" />
                        </p:menuitem>
                          <p:menuitem value="Entity Search" action="#{MenuView.entitySearch}" icon="pi pi-search">
                            <f:param name="i" value="3" />
                        </p:menuitem>
                        
                         <p:menuitem value="Entity Version Search" action="#{MenuView.entityVersionSearch}" icon="pi pi-search">
                            <f:param name="i" value="4" />
                        </p:menuitem>
                         <p:menuitem value="Report Status" action="#{MenuView.kycReportStatus}" icon="pi pi-search">
                            <f:param name="i" value="5" />
                        </p:menuitem>
                         <p:menuitem value="Results" action="#{MenuView.kycResults}" icon="pi pi-search">
                            <f:param name="i" value="6" />
                        </p:menuitem>
                         <p:menuitem value="Request By" action="#{MenuView.kycRequestBy}" icon="pi pi-search">
                            <f:param name="i" value="7" />
                        </p:menuitem>
                         <p:menuitem value="BCP" action="#{MenuView.Business_Counterparty_Category}" icon="pi pi-search">
                            <f:param name="i" value="8" />
                        </p:menuitem>
                        
                         <p:menuitem value="Report" action="#{MenuView.report}" icon="pi pi-search">
                            <f:param name="i" value="9" />
                        </p:menuitem>
                        
                        <p:menuitem   value="Level2"  rendered="#{MenuView.isLevel2}"  url="/KycReport/rfimaster.xhtml" />
                        <p:menuitem   value="Level1" rendered="#{MenuView.isLevel1}"  url="/KycReport/apmaster.xhtml"/>
                       
                    </p:tabMenu>
                       
                </div>
            </h:form>
        </ui:composition>
    </body>
</html>
