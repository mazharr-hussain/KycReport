<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>User List</title>
        <h:outputStylesheet library="css" name="styles.css" />
        <link type="text/css" rel="stylesheet" 
              href="/JavaServerFaces/faces/javax.faces.resource/table-style.css?ln=css" />
        <style type="text/css">
            .ui-datatable .ui-datatable-header {
                text-align: right !important;
            }

            .ui-button-text-only .ui-button-text {
                padding: 0.3em 0.4em;
            }

            .ui-selectcheckboxmenu-panel .ui-selectcheckboxmenu-header .ui-chkbox {
                visibility: hidden;
            }

            .ui-filter-column .ui-column-customfilter .custom-filter {
                width: 100%;
                box-sizing: border-box;
            }

            .year-spinner input {
                width: 100%;
                box-sizing: border-box;
            }
            .value {
                font-weight: bold;
            }
        </style>
    </h:head>

    <h:body>

        <h:outputStylesheet library="css" name="QDstyle.css" />
        <h:outputStylesheet library="css" name="QDbootstrap.css" />

        <h:form id="form" style="font-size:12px;"> 
            <p:growl id="mainmsgs"  />

                <p:outputPanel >
                    <p:panel header="Report">
                        <h:panelGrid columns="2" border="1" >

                             <h:outputLabel value=" Report Status  "  />
                              <h:outputLabel value=""  />


                            <h:outputLabel value=" Low "  />
                             <h:commandButton action="#{reportsUtils.entityLowExtract()}" value="Download" /> 
                          
                            
                             <h:outputLabel value=" Medium "  />
                              <h:commandButton action="#{reportsUtils.entityMediumExtract()}" value="Download" /> 
                            
                             
                        <h:outputLabel value=" High "  />
                         <h:commandButton action="#{reportsUtils.entityHighExtract()}" value="Download" /> 
                            
                        <!--     <h:outputLabel value="Approved Report List : "  />
                             <p:commandLink >
                      <h:graphicImage value="/img/ExcelLogo.jpg" />
                     </p:commandLink>
                             -->
                        </h:panelGrid>
                    </p:panel>
                </p:outputPanel>
           
        </h:form>

    </h:body>
</html>
